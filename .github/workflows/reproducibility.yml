name: reproducibility

on:
  push:
  pull_request:

jobs:
  # Lint, vet, build and test, on every platform letsgo runs on.
  #
  # This is the shared reusable workflow the other repos call, but fanned out
  # over a matrix instead of a single runner: a release tool has to be correct
  # on all three, and the test suite is also the same-machine reproducibility
  # check, varying source directory, work directory, TMPDIR, wall clock and
  # build cache within one host.
  same-machine:
    name: same machine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v1
    # Nothing here writes: tagging is letsgo's own job, not this workflow's.
    permissions:
      contents: read
    with:
      runs-on: ${{ matrix.os }}
      vet: true

      # The repro suite rebuilds fixtures repeatedly, so it needs longer than
      # the 10m default.
      #
      # The coverage flag is quoted because this line is run through pwsh on
      # the Windows runner, which splits the bare form and hands `go` a stray
      # `.txt` to resolve as a package. Quoting makes it one token in both
      # shells; flags go before the pattern for the same reason.
      test-command: go test '-coverprofile=coverage.txt' -timeout 20m ./...

      # One upload is enough; three would be the same lines counted three
      # times under different runners.
      coverage: ${{ matrix.os == 'ubuntu-latest' }}

      # letsgo tags itself with `letsgo tag`, and release.yml fires on the tag
      # push. A second tagger here would race its own release path — and on a
      # matrix it would race two copies of itself as well.
      tag: false

      # No .gremlins.yaml yet.
      mutate: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Do two machines agree with each other? This is the claim a third party
  # relies on when they run letsgo verify on hardware we do not control, and
  # the one that decides whether the tool has a reason to exist.
  cross-machine:
    name: digests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is here to be a second linux/amd64 machine, not a second
        # distribution: cgo digests are only compared within a host platform,
        # so without a pair of them that comparison would have nothing to
        # compare and would pass by having nothing to say.
        os: [ubuntu-latest, ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # go.mod carries an exact patch version, not a major.minor. Compiler and
      # linker output can legitimately differ between Go releases, so skew
      # between two runners would look like a reproducibility failure. The
      # toolchain is a build input, and the release manifest records it for the
      # same reason — reading it from go.mod keeps one source of truth, shared
      # with the shared workflow above.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: build fixture and record digests
        run: go run ./internal/repro/cmd/reprodigest > digests.json

      - run: cat digests.json

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.os }}
          path: digests.json

  compare:
    name: compare across machines
    needs: cross-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests

      # Two claims, because they are not the same claim.
      #
      # Everything letsgo compiles with the Go toolchain alone must be
      # byte-identical on every runner. That is the claim a third party relies
      # on, and it is absolute.
      #
      # cgo is narrower. zig is pinned by digest, but it is not hermetic: the
      # same compiler, compiling the same C for the same target, emits
      # different objects depending on the machine it runs on — which
      # cc_objects demonstrates directly, with no Go involved. So cgo digests
      # are compared within a host platform and reported across them, and
      # letsgo.json records the host so a verifier knows which it has.
      - name: every machine must produce identical pure-Go artifacts
        run: |
          set -euo pipefail
          reference=""
          failed=0

          for file in digests/*/digests.json; do
            shared="${file%.json}.shared.json"
            jq -S 'del(.host, .cc_objects, .cgo_artifacts)' "$file" > "$shared"

            echo "--- $file (host $(jq -r .host "$file"))"
            cat "$file"

            if [ -z "$reference" ]; then
              reference="$shared"
              continue
            fi
            if ! diff -u "$reference" "$shared"; then
              echo "::error::artifacts differ between $reference and $shared"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::builds are not reproducible across machines"
            exit 1
          fi
          echo "all machines produced byte-identical pure-Go artifacts"

      - name: cgo artifacts must agree within a host platform
        run: |
          set -euo pipefail
          failed=0

          # Group the reports by the platform that produced them. Two runners
          # of the same platform must agree; two of different platforms are
          # not being asked to.
          for host in $(jq -rs 'map(.host) | unique[]' digests/*/digests.json); do
            reference=""
            for file in digests/*/digests.json; do
              [ "$(jq -r .host "$file")" = "$host" ] || continue

              cgo="${file%.json}.cgo.json"
              jq -S '{cc, cc_objects, cgo_artifacts}' "$file" > "$cgo"

              if [ -z "$reference" ]; then
                reference="$cgo"
                continue
              fi
              if ! diff -u "$reference" "$cgo"; then
                echo "::error::cgo artifacts differ between two $host machines"
                failed=1
              fi
            done
            echo "$host: cgo artifacts agree"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::cgo builds are not reproducible on a single host platform"
            exit 1
          fi
