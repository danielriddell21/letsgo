name: reproducibility

on:
  push:
  pull_request:

jobs:
  # Lint, vet, build and test, on every platform letsgo runs on.
  #
  # This is the shared reusable workflow the other repos call, but fanned out
  # over a matrix instead of a single runner: a release tool has to be correct
  # on all three, and the test suite is also the same-machine reproducibility
  # check, varying source directory, work directory, TMPDIR, wall clock and
  # build cache within one host.
  same-machine:
    name: same machine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    # Nothing here writes: tagging is letsgo's own job, not this workflow's.
    permissions:
      contents: read
    with:
      runs-on: ${{ matrix.os }}
      vet: true

      # The repro suite rebuilds fixtures repeatedly, so it needs longer than
      # the 10m default.
      #
      # The coverage flag is quoted because this line is run through pwsh on
      # the Windows runner, which splits the bare form and hands `go` a stray
      # `.txt` to resolve as a package. Quoting makes it one token in both
      # shells; flags go before the pattern for the same reason.
      test-command: go test '-coverprofile=coverage.txt' -timeout 20m ./...

      # One upload is enough; three would be the same lines counted three
      # times under different runners.
      coverage: ${{ matrix.os == 'ubuntu-latest' }}

      # letsgo tags itself with `letsgo tag`, and release.yml fires on the tag
      # push. A second tagger here would race its own release path — and on a
      # matrix it would race two copies of itself as well.
      tag: false

      # No .gremlins.yaml yet.
      mutate: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Do two machines agree with each other? This is the claim a third party
  # relies on when they run letsgo verify on hardware we do not control, and
  # the one that decides whether the tool has a reason to exist.
  cross-machine:
    name: digests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # go.mod carries an exact patch version, not a major.minor. Compiler and
      # linker output can legitimately differ between Go releases, so skew
      # between two runners would look like a reproducibility failure. The
      # toolchain is a build input, and the release manifest records it for the
      # same reason — reading it from go.mod keeps one source of truth, shared
      # with the shared workflow above.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: build fixture and record digests
        run: go run ./internal/repro/cmd/reprodigest > digests.json

      - run: cat digests.json

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.os }}
          path: digests.json

  compare:
    name: compare across machines
    needs: cross-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests

      - name: every machine must produce identical artifacts
        run: |
          set -euo pipefail
          reference=""
          failed=0

          for file in digests/*/digests.json; do
            echo "--- $file"
            cat "$file"
            if [ -z "$reference" ]; then
              reference="$file"
              continue
            fi
            if ! diff -u "$reference" "$file"; then
              echo "::error::artifacts differ between $reference and $file"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::builds are not reproducible across machines"
            exit 1
          fi
          echo "all machines produced byte-identical artifacts"

  # Tag trunk with letsgo's own tagger.
  #
  # The shared workflow's tag job is off (above) because letsgo has a `tag`
  # verb of its own, and a release tool that reached for someone else's action
  # to decide its own version would be saying it does not trust its answer.
  #
  # It reads the same conventional commits a tag action would. Its second
  # signal, the exported API diff, has nothing to say here: letsgo is one main
  # package and the rest internal, so no dependant can be broken by it, and
  # apidiff is deliberately not installed for a comparison that would always
  # be empty. In a repository with an importable surface that signal is what
  # catches a removal no commit message confessed to.
  tag:
    name: tag
    # A tag starts a release, so it must never name a commit CI has rejected.
    needs: [same-machine, compare]
    # Only a push to trunk. `on: push` fires for the tag this job creates too,
    # and tagging a tag is how a loop starts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    # Nothing is written with the workflow token; the push below uses its own.
    permissions:
      contents: read
    steps:
      # Checked before the clone so a missing secret fails here, saying what
      # is missing, rather than as an unauthenticated checkout further down.
      - name: the token must exist
        env:
          TOKEN: ${{ secrets.LETSGO_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::LETSGO_TOKEN is not set; a tag pushed with the workflow token starts no release"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # letsgo tag looks for the previous tag and compares this tree's
          # exported API against that one's, so the usual shallow clone with
          # no tags is not enough.
          fetch-depth: 0

          # A tag pushed with the workflow token starts no workflow, so
          # release.yml would never fire. A token of its own does.
          token: ${{ secrets.LETSGO_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: tag and push
        run: |
          set -euo pipefail

          # A commit that already carries a tag has been released. letsgo
          # ignores tags on HEAD when it looks for the previous one, so without
          # this it would propose a second version for the same commit.
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already tagged; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --warranted: no feat, fix or API change means no release. Without
          # it letsgo falls back to a patch, which is the right answer when a
          # person asks for a version and the wrong one when a documentation
          # commit does.
          go run ./cmd/letsgo tag --yes --warranted

          tag=$(git tag --points-at HEAD)
          if [ -z "${tag}" ]; then
            exit 0
          fi
          git push origin "${tag}"
