name: reproducibility

on:
  push:
  pull_request:

jobs:
  # Lint, vet, build and test, on every platform letsgo runs on.
  #
  # This is the shared reusable workflow the other repos call, but fanned out
  # over a matrix instead of a single runner: a release tool has to be correct
  # on all three, and the test suite is also the same-machine reproducibility
  # check, varying source directory, work directory, TMPDIR, wall clock and
  # build cache within one host.
  same-machine:
    name: same machine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v1
    # Nothing here writes: tagging is letsgo's own job, not this workflow's.
    permissions:
      contents: read
    with:
      runs-on: ${{ matrix.os }}
      vet: true

      # The repro suite rebuilds fixtures repeatedly, so it needs longer than
      # the 10m default.
      #
      # The coverage flag is quoted because this line is run through pwsh on
      # the Windows runner, which splits the bare form and hands `go` a stray
      # `.txt` to resolve as a package. Quoting makes it one token in both
      # shells; flags go before the pattern for the same reason.
      test-command: go test '-coverprofile=coverage.txt' -timeout 20m ./...

      # One upload is enough; three would be the same lines counted three
      # times under different runners.
      coverage: ${{ matrix.os == 'ubuntu-latest' }}

      # letsgo tags itself with `letsgo tag`, and release.yml fires on the tag
      # push. A second tagger here would race its own release path — and on a
      # matrix it would race two copies of itself as well.
      tag: false

      # No .gremlins.yaml yet.
      mutate: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Do two machines agree with each other? This is the claim a third party
  # relies on when they run letsgo verify on hardware we do not control, and
  # the one that decides whether the tool has a reason to exist.
  cross-machine:
    name: digests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # go.mod carries an exact patch version, not a major.minor. Compiler and
      # linker output can legitimately differ between Go releases, so skew
      # between two runners would look like a reproducibility failure. The
      # toolchain is a build input, and the release manifest records it for the
      # same reason — reading it from go.mod keeps one source of truth, shared
      # with the shared workflow above.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: build fixture and record digests
        run: go run ./internal/repro/cmd/reprodigest > digests.json

      - run: cat digests.json

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: digests.json

  compare:
    name: compare across machines
    needs: cross-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests

      - name: every machine must produce identical artifacts
        run: |
          set -euo pipefail
          reference=""
          failed=0

          for file in digests/*/digests.json; do
            echo "--- $file"
            cat "$file"
            if [ -z "$reference" ]; then
              reference="$file"
              continue
            fi
            if ! diff -u "$reference" "$file"; then
              echo "::error::artifacts differ between $reference and $file"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::builds are not reproducible across machines"
            exit 1
          fi
          echo "all machines produced byte-identical artifacts"
