name: promote

on:
  # Flipping a prerelease's "Set as a pre-release" checkbox off in the GitHub
  # UI fires this event. A human flip is a real actor, not a workflow-token
  # write, so it starts the run without needing an App token of its own.
  release:
    types: [released]

  # Same re-run affordance release.yml gives itself: a failed promotion, or
  # one that predates this workflow, can be replayed by hand. Promoting is
  # idempotent (it refuses once the stable tag already exists), so a second
  # run is safe.
  workflow_dispatch:
    inputs:
      tag:
        description: "RC tag to promote"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  promote:
    name: promote
    # release: released also fires for an ordinary stable release; only a
    # prerelease tag (one that carries a "-") is something to promote.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      # Published with the workflow token, this release would be credited to
      # github-actions[bot] instead of the identity every other release-time
      # write already uses (the tag itself, the tap commit).
      - uses: actions/create-github-app-token@v3
        id: letsgo-token
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          repositories: letsgo

      # Deliberately does not carry the token above: its embedded git
      # credential is only used if letsgo promote pushes with git directly,
      # and that push must stay on the default token so it does not
      # retrigger release.yml (see internal/promote — the stable release is
      # published directly by this workflow instead).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

          # Full history, unlike release.yml: the "Prerelease history" section
          # is built from local git and is skipped on a shallow clone. Promote
          # runs by hand, so the slower checkout costs little here.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      # See release.yml: scoped to the tap alone, so the App need not be
      # installed on this repository at all.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      # letsgo promote tags the stable commit itself (internal/promote.go),
      # which needs a git identity to record on the annotated tag — see
      # reproducibility.yml's tag job for the same requirement. A local
      # composite action needs the checkout above to already exist on disk.
      - uses: ./.github/actions/champ-git-identity

      - name: promote
        uses: danielriddell21/letsgo-action@v1
        with:
          version: local
          command: promote
          args: --yes --work dist ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ steps.letsgo-token.outputs.token }}
          tap-token: ${{ steps.tap-token.outputs.token }}

      - name: attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/build/*.tar.gz
            dist/build/*.zip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7
