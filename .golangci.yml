version: "2"

linters:
  default: standard
  enable:
    - dupl
    - cyclop
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - thelper
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    wrapcheck:
      # Errors from letsgo's own packages already carry their package name
      # ("build: ...", "oci: ..."), so wrapping one again at the call site
      # produces "release: build: ..." and says nothing new. Errors crossing
      # in from outside the module still have to be wrapped.
      ignore-package-globs:
        - github.com/danielriddell21/letsgo/*

    gosec:
      excludes:
        - G107
        - G115
        - G204
        - G304
        - G404
        - G602
        - G703
  exclusions:
    paths:
      - examples
    rules:
      - path: (^|/)(internal|cmd)/
        linters:
          - revive
      - path: "_test\\.go"
        linters:
          - revive
          - dupl
          - wrapcheck
          - gosec
          - unparam
          - gocognit
          - cyclop
          - prealloc
          - errcheck
          - gocritic
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - examples
  settings:
    goimports:
      local-prefixes:
        - github.com/danielriddell21/letsgo
